description: >-
  FinOps view of HawkSoft spend. Two cost streams exist. For an agency, cost is
  the HawkSoft AMS subscription, billed per seat monthly (a base fee plus roughly
  $94 per user per month, custom quoted) plus one-time setup and training - a
  predictable per-user run-rate rather than usage-metered API spend. For a
  technology partner, cost is the Partner API program's $3,000 per year fee
  (waivable), a flat annual charge independent of call volume. Neither surface is
  metered by API request volume, so FinOps attention centers on seat count
  (agency side) and the flat annual partner fee (vendor side).
notes: >-
  AMS per-seat figures are third-party-reported and not officially published;
  the $3,000/year API fee is from HawkSoft's API Terms. Verify both directly.
