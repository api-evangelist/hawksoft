principles:
- name: Visibility
  description: Track active seat count per office and the flat annual API fee; neither scales with API call volume.
- name: Allocation
  description: Map seats to offices/teams; attribute the partner API fee to the integration product it enables.
- name: Optimization
  description: Right-size seat count to active staff; pursue the API-fee waiver where HawkSoft grants it; reuse incremental sync to keep integration infrastructure light.
- name: Accountability
  description: Review seat count and renewal terms annually; assign an owner for the partner agreement and its renewal.
