aid: hawksoft
url: https://raw.githubusercontent.com/api-evangelist/hawksoft/refs/heads/main/apis.yml
name: HawkSoft
kind: company
description: HawkSoft is an insurance agency management system (AMS) for independent
  property and casualty agencies, covering client management, policy tracking,
  documentation, accounting, and workflow automation. HawkSoft operates a gated
  Partner API program that lets vetted third-party technology vendors and agencies
  read agency, office, client, contact, policy, coverage, vehicle, driver, and log
  data, and (with 2-way integration) write activities back into HawkSoft as log
  notes, attachments, and payment receipts. The Partner API documentation is
  publicly readable at partner.hawksoft.app, but credentials are issued only to
  approved API Partners, and an agency must opt in to share its data. Endpoints
  are versioned (V1.8 and V3.0, with V3.0 built on the HawkSoft 6 cloud data
  model).
